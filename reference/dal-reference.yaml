# Non-normative reference representation of Decision Authority Layer (DAL) concepts.
# This file is illustrative only and does not imply specific implementation or enforcement mechanics.

decision_units:
  - id: "DU-001"
    description: "Primary decision-making context or functional outcome."
    assigned_authority:
      holder_id: "AH-001"
      scope_definition:
        allowed_actions:
          - "action_identifier_1"
          - "action_identifier_2"
        constraints:
          - "resource_limit_value"
          - "operational_boundary_condition"
    escalation_protocol:
      path_id: "EP-001"
      triggers:
        - "scope_violation"
        - "confidence_threshold_breach"
    accountability:
      record_id: "AR-001"

authority_holders:
  - id: "AH-001"
    type: "system_agent" # or human_operator
    description: "Entity designated to execute decisions within the defined scope."

escalation_paths:
  - id: "EP-001"
    target_authority_id: "AH-002"
    description: "Route for decisions exceeding the assigned authority scope."

accountability_records:
  - id: "AR-001"
    description: "Log or artifact ensuring transparency of the decision event."
    fields:
      - "timestamp"
      - "decision_input"
      - "decision_output"
      - "acting_authority_id"
